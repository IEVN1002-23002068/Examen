@if (servicio.flash(); as f) {
  <div
    role="alert"
    class="rounded-lg border p-4 text-sm font-medium"
    [class.border-green-300]="f.tipo === 'ok'"
    [class.bg-green-50]="f.tipo === 'ok'"
    [class.text-green-800]="f.tipo === 'ok'"
    [class.border-red-300]="f.tipo === 'error'"
    [class.bg-red-50]="f.tipo === 'error'"
    [class.text-red-800]="f.tipo === 'error'">
    {{ f.texto }}
  </div>
}
