<div class="rounded-lg border-2 border-gray-900 bg-white p-5 shadow-sm">

  <h2 class="mb-3 text-lg font-bold text-gray-900">Detalle del pedido</h2>

  <div class="relative overflow-x-auto rounded-lg border border-gray-200">
    <table class="w-full text-left text-sm text-gray-600">
      <thead class="bg-gray-100 text-xs uppercase text-gray-700">
        <tr>
          <th class="px-4 py-3">Tamaño</th>
          <th class="px-4 py-3">Ingredientes</th>
          <th class="px-4 py-3">Núm. pizzas</th>
          <th class="px-4 py-3">Subtotal</th>
        </tr>
      </thead>
      <tbody>
        @for (d of servicio.detalle(); track d.id) {
          <tr
            (click)="seleccionar(d.id)"
            class="cursor-pointer border-b border-gray-200 hover:bg-gray-50"
            [class.bg-blue-100]="seleccionado() === d.id"
            [class.bg-white]="seleccionado() !== d.id">
            <td class="px-4 py-3 font-medium text-gray-900">{{ d.tamano }}</td>
            <td class="px-4 py-3">{{ d.ingredientes }}</td>
            <td class="px-4 py-3">{{ d.num_pizzas }}</td>
            <td class="px-4 py-3">${{ d.subtotal }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-4 py-8 text-center text-gray-500">
              Aún no hay pizzas en el pedido
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <p class="mt-3 text-right text-base font-bold text-gray-900">
    Total: ${{ servicio.total() }}
  </p>

  <div class="mt-4 flex justify-between">
    <button type="button" (click)="quitar()"
      class="rounded-lg bg-red-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-red-800 focus:outline-none focus:ring-4 focus:ring-red-300">
      Quitar
    </button>

    <button type="button" (click)="terminar()"
      class="rounded-lg bg-green-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-green-800 focus:outline-none focus:ring-4 focus:ring-green-300">
      Terminar
    </button>
  </div>

</div>
